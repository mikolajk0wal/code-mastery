# Database config

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:my-db}
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD:user}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

# Logging
logging.level.root=WARN
spring.main.banner-mode=off

# Server config
server.servlet.context-path=/api

# S3 config
cloud.do.region.name=eu-central-1
cloud.do.bucket.name=code-mastery-272115513781-eu-central-1-an
cloud.do.cdn.endpoint=" "

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
management.endpoints.web.exposure.include=health
