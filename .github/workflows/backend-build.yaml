name: Backend deployment

on:
  push:
    branches: [ main, dev ]
    paths:
      - backend/**
      - .github/workflows/backend-*.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    env:
      AWS_REGION: eu-central-1
    permissions:
      checks: write
      contents: read
      id-token: write
      issues: read
      pull-requests: write
    runs-on: ubuntu-latest
    name: Build backend
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: ⚙️ Set environment variables
        run: |
           if [[ "${{ github.ref_name }}" == "main" ]]; then
             echo "ENV_NAME=prod" >> $GITHUB_ENV
             echo "ECR_REPOSITORY=code-mastery" >> $GITHUB_ENV
           else
             echo "ENV_NAME=dev" >> $GITHUB_ENV
             echo "ECR_REPOSITORY=code-mastery-dev" >> $GITHUB_ENV          
          fi
      - name: Setup JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c #v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        working-directory: backend
        run: mvn --batch-mode verify
      - name: Store results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: Tests results
          path: backend/target/surefire-reports
      - name: Build docker image
        run: docker build -f backend/Dockerfile -t code-mastery:${{ github.sha }} backend
      - name: 🔧 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: ☁️ Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
      - name: 📦 Push docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker tag "code-mastery:${{ github.sha }}" "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
      - name: 📥 Download current task definition
        run: |
          aws ecs describe-task-definition \
          --task-definition code-mastery-${{ env.ENV_NAME }}-task \
          --query taskDefinition > task-definition.json

      - name: 📝 Render new task definition
        id: render-container
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 #1.9.1
        with:
          task-definition: task-definition.json
          container-name: code-mastery-${{ env.ENV_NAME }}
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: 🚀 Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # 2.6.4
        with:
          task-definition: ${{ steps.render-container.outputs.task-definition }}
          service: code-mastery-${{ env.ENV_NAME }}-service
          cluster: code-mastery-${{ env.ENV_NAME }}-cluster
          wait-for-service-stability: true